name: Bootstrap Cloud Database

on:
  workflow_dispatch:
    inputs:
      run_db_push:
        description: "Run drizzle schema push to DATABASE_URL"
        required: true
        default: true
        type: boolean
      run_team_sync:
        description: "Run importer/sync_airtable.py (requires AIRTABLE_PAT secret)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required DATABASE_URL secret
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL secret is not set."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web dependencies
        run: npm --prefix web install

      - name: Push schema with Drizzle
        if: ${{ inputs.run_db_push }}
        run: npm --prefix web run db:push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r importer/requirements.txt

      - name: Sync teams from Airtable
        if: ${{ inputs.run_team_sync }}
        run: |
          if [ -z "${AIRTABLE_PAT}" ]; then
            echo "AIRTABLE_PAT secret is required when run_team_sync=true."
            exit 1
          fi
          python importer/sync_airtable.py
