      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies (with retry)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            python -m pip install --upgrade pip
            pip install -r importer/requirements.txt

      - name: Run NHL importer (with retry)
        uses: nick-fields/retry@v4
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          timeout_minutes: 30
          max_attempts: 2
          command: python importer/import_nhl_games.py

  nba:
    name: Import NBA
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
