            python -m pip install --upgrade pip
            pip install -r importer/requirements.txt

      - name: Run NFL importer (with retry)
        uses: nick-fields/retry@v4
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          timeout_minutes: 30
          max_attempts: 2
          command: python importer/import_nfl_games.py

  nhl:
    name: Import NHL
    runs-on: ubuntu-26.04
    timeout-minutes: 45
