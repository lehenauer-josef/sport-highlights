name: Daily Sports Importers

on:
  # Triggered daily by an external cron-job.org job via the GitHub API
  # (GitHub's own `schedule` trigger started runs hours late).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-importers
  cancel-in-progress: false

jobs:
  cfb:
    name: Import CFB
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies (with retry)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            python -m pip install --upgrade pip
            pip install -r importer/requirements.txt

      - name: Run CFB importer (with retry)
        uses: nick-fields/retry@v4
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        with:
          timeout_minutes: 30
          max_attempts: 2
          command: python importer/import_games.py --recent-weeks 2

  nfl:
    name: Import NFL
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
