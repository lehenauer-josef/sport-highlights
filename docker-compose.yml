services:
  db:
    image: postgres:16-alpine
    container_name: cfb_highlights_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cfb
      POSTGRES_PASSWORD: cfb
      POSTGRES_DB: highlights
    ports:
      - "5433:5432"
    volumes:
      - cfb_db_data:/var/lib/postgresql/data

volumes:
  cfb_db_data:
